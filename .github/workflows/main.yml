name: generate animation

on:
  # GitHub Actions 的 cron 使用 UTC；这里对应北京时间每天 10:23，避开整点高峰。
  schedule:
    - cron: "23 2 * * *"

  # 允许在 Actions 页面手动触发，便于排查定时任务是否被禁用。
  workflow_dispatch:

  # main 分支更新时也触发一次，避免只依赖定时任务。
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generate-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 生成 GitHub 贡献图贪吃蛇 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布 SVG 到 output 分支
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
